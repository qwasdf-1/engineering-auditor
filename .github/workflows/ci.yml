name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        run: rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Detector architecture contract
        run: |
          python3 tooling/detector_gate_lint.py
          python3 tooling/lint/detector_arch.py
          python3 -m unittest tooling.lint.test_detector_arch tooling.test_detector_gate_contract
          python3 -m unittest tooling.ecosystem.test_manifest tooling.ecosystem.test_run tooling.ecosystem.test_labels tooling.ecosystem.test_oracles tooling.ecosystem.test_syntax_coverage
          python3 -m unittest tooling.release.test_changelog_section tooling.release.test_third_party_licenses tooling.recall.test_run tooling.live_provider.test_compare_prompt_candidate

      - name: Recall benchmark
        run: |
          cargo build --locked -p auditor-cli
          python3 tooling/recall/run.py --auditor target/debug/auditor --check eval/recall/baseline.json

      - name: Feature capability contract
        run: >-
          cargo test --locked -p auditor-detectors --features graph-analysis
          capability_contract

      - name: CLI smoke test (gating)
        run: cargo run -p auditor-cli -- scan --repo-root . --format json > /dev/null

      - name: CLI smoke test (full)
        run: cargo run -p auditor-cli -- scan --repo-root . --profile full --format json > /dev/null

      - name: Reviewed zero-new gate
        run: >-
          cargo run -p auditor-cli -- gate --repo-root .
          --baseline config/auditor/gating-baseline-v1.json > /dev/null

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Donor policy check
        run: cargo run -p auditor-cli -- donor check

  donor-oracle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, engineering-auditor-donors]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Run every provisioned live donor parity group
        run: >-
          cargo test --locked -p auditor-detectors
          --features donor-oracle,graph-analysis
          -- --ignored --test-threads=1

  doc-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify spec claims
        run: python3 tooling/doc_hygiene/verify_spec_claims.py
