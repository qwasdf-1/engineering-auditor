[package]
name = "auditor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true

[[bin]]
name = "auditor"
path = "src/main.rs"

[dependencies]
auditor-core = { path = "../auditor-core" }
auditor-detectors = { path = "../auditor-detectors" }
auditor-donors = { path = "../auditor-donors" }
auditor-report = { path = "../auditor-report" }
auditor-review = { path = "../auditor-review" }
auditor-scan = { path = "../auditor-scan" }
serde_json = "1"

[features]
graph-analysis = ["auditor-detectors/graph-analysis", "auditor-scan/graph-analysis"]
